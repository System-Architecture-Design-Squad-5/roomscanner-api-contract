asyncapi: 3.0.0
info:
  title: RoomScanner Squad - Kafka Integration (PP Microservices <-> CP Modular Monolith)
  version: 1.0.0
  description: |-
    Kafka bindings of the squad API contract at Ultimo (INT-U01 to INT-U03). Provider Portal (PP) runs a Microservices architecture (BE-U01 to BE-U09), while Customer Portal (CP) runs a Modular Monolith architecture (BE-M01 to BE-M08) via PartnerIntegrationModule. Operations are described from the Provider Portal's point of view: `receive` operations are served by PP, `send` operations are produced by PP. The Customer Portal performs the mirror operation on each channel.

    Every message uses the envelope in `common/04-kafka.md` Section 1. Requests carry `replyTo`; responses copy the request's `correlationId` (INT-U02). A resend keeps the `correlationId`, gets a new `messageId` and increments `attempt` (INT-U03). Delivery is at-least-once and responders are idempotent.
defaultContentType: application/json
servers:
  squadBroker:
    host: kafka.{squad}.roomscanner.local:9093
    protocol: kafka-secure
    description: Squad Kafka broker on Machine 4 (DEP-U04). SASL_SSL with SCRAM-SHA-512; topic auto-creation disabled.
    variables:
      squad:
        default: squad
        description: Squad identifier
    security:
    - $ref: '#/components/securitySchemes/scram'
