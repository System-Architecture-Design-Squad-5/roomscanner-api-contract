openapi: 3.0.3
info:
  title: RoomScanner Customer Portal - Partner API
  version: 1.0.0
  description: |-
    REST API that the **Customer Portal (CP)** (*Modular Monolith architecture*, `BE-M01` to `BE-M08`) provides to the **Provider Portal (PP)** (*Microservices architecture*, `BE-U01` to `BE-U09`).
    This file is the machine-readable form of `customer-portal/CP-01` to `CP-04` (indexed in `customer-portal/CP-services-required-by-PP.md`). CP owns these operations and has reviewed and confirmed this specification.
    Within CP's Modular Monolith, `PartnerIntegrationModule` dispatches requests in-process via external service interfaces (`IRatingExternalService`, `IEventExternalService`, `IBookingExternalService`).
    At Ultimo the same payloads are exchanged over Kafka (see `specs/asyncapi/roomscanner-kafka.yaml`), with a second instance of the CP modular monolith whose rating consumer also joins group `cp-rating-service`.
  contact:
    name: RoomScanner squad API contract
    url: https://github.com/SQUAD-ORGANIZATION/roomscanner-api-contract
servers:
- url: http://localhost:9080/api/v1/partner
  description: Local / Simplex
- url: https://cp-api.{squad}.roomscanner.local/api/v1/partner
  description: Deployed (CP Modular Monolith, single deployable; no API Gateway; served by PartnerIntegrationModule)
  variables:
    squad:
      default: squad
      description: Squad identifier
tags:
- name: Partner authentication
  description: Client-credentials token for partner calls (INT-M03)
- name: Ratings
  description: CP-owned review statistics
- name: Membership
  description: Customer Premium membership
- name: Orders
  description: Simplex simulated payment orders
- name: Booking events
  description: Webhook receiving PP booking status events
paths:
  /auth/token:
    post:
      tags:
      - Partner authentication
      operationId: issuePartnerToken
      summary: Issue a partner access token
      description: 'Custom JSON credential exchange for a short-lived signed JWT; this is not an OAuth2 token endpoint. Secrets
        are shared out-of-band and never committed. Rate limit: 10 requests per 60 s.'
      x-contract-id: AUTH-01
      security: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              default:
                value:
                  clientId: pp-subsystem
                  clientSecret: replace-with-secret-from-environment-0123456789
                  scope:
                  - rating:read
                  - membership:read
      responses:
        '200':
          description: Token issued.
          headers:
            X-Request-Id:
              description: Echo of the request header
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Correlation-Id:
              description: Echo of this logical operation's correlation ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Trace-Id:
              description: Echo of the business-flow trace ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-RateLimit-Limit:
              description: Requests allowed in the window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in the window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InBwLTIwMjYtMTEifQ.eyJzdWIiOiJjcC1zdWJzeXN0ZW0ifQ.c2lnbmF0dXJl
                    tokenType: Bearer
                    expiresIn: 900
                    scope:
                    - rating:read
                    - membership:read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
