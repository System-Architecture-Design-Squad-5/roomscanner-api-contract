  /orders/{orderId}:
    patch:
      tags:
      - Orders
      operationId: updateSimulatedOrder
      summary: CP-OP-03 Complete or cancel simulated order
      description: |-
        Simplex only. PP completes or cancels the simulated order issued by CP. ISSUED may become COMPLETED or CANCELLED; COMPLETED may become CANCELLED for a subsequent booking cancellation. A matching repeat is idempotent; CANCELLED cannot become COMPLETED and the booking binding cannot change.

        **SRS traceability:** PP-MONEY-S01; CP-MONEY-S01
      x-contract-id: CP-OP-03
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XTraceId'
      - name: orderId
        in: path
        required: true
        description: CP order ID
        schema:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
            examples:
              complete:
                value:
                  action: COMPLETE
                  bookingId: 8c9d0e1f-0000-4000-8000-000000000801
      responses:
        '200':
          description: Order updated.
          headers:
            X-Request-Id:
              description: Echo of the request header
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Correlation-Id:
              description: Echo of this logical operation's correlation ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Trace-Id:
              description: Echo of the business-flow trace ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-RateLimit-Limit:
              description: Requests allowed in the window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in the window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                default:
                  value:
                    orderId: 55aa66bb-0000-4000-8000-000000000701
                    status: COMPLETED
                    bookingId: 8c9d0e1f-0000-4000-8000-000000000801
                    updatedAt: '2026-12-01T09:15:41Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          description: Order state or idempotency conflict.
          headers:
            X-Request-Id:
              description: Echo of the request header
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Correlation-Id:
              description: Echo of this logical operation's correlation ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Trace-Id:
              description: Echo of the business-flow trace ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                state:
                  value:
                    error:
                      code: STATE_CONFLICT
                      message: The order is already CANCELLED.
                      requestId: 0b6f8f4c-5a5e-4c55-8a39-31b2f1b9b0a7
                      timestamp: '2026-11-20T11:00:00Z'
                idempotency:
                  value:
                    error:
                      code: IDEMPOTENCY_CONFLICT
                      message: This Idempotency-Key was already used with a different request body.
                      requestId: 0b6f8f4c-5a5e-4c55-8a39-31b2f1b9b0a7
                      timestamp: '2026-11-20T11:00:00Z'
      security:
      - partnerBearer: []
      x-required-scopes:
      - order:write
  /booking-events:
    post:
      tags:
      - Booking events
      operationId: receiveBookingEvent
      summary: CP-OP-04 Receive booking status event (webhook)
      description: |-
        Webhook that PP calls for every booking transition (PP-OP-11). CP acknowledges within 5 s and does email and socket work asynchronously. CP de-duplicates on eventId. The X-RS-Signature header carries t=<unixSeconds>,v1=HMAC-SHA256(secret, t + '.' + rawBody); requests older than 300 s are rejected.

        **SRS traceability:** PP-MONEY-S01, M03; CP-MONEY-S01, M02

        **Ultimo Kafka binding:** replaced by rs.booking.events.v1 (PP -> CP)
      x-contract-id: CP-OP-04
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
