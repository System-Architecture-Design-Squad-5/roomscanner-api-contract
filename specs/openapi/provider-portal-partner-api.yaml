            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Correlation-Id:
          description: Echo of this logical operation's correlation ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Trace-Id:
          description: Echo of the business-flow trace ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error:
                  code: RESOURCE_NOT_FOUND
                  message: The requested resource does not exist.
                  requestId: 0b6f8f4c-5a5e-4c55-8a39-31b2f1b9b0a7
                  timestamp: '2026-11-20T11:00:00Z'
    TooManyRequests:
      description: Rate limit exceeded (BE-U04).
      headers:
        X-Request-Id:
          description: Echo of the request header
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Correlation-Id:
          description: Echo of this logical operation's correlation ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Trace-Id:
          description: Echo of the business-flow trace ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        Retry-After:
          description: Seconds before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: Rate limit exceeded for this scope (see common/01-conventions.md Section 7). Retry after the Retry-After
                    interval.
                  requestId: 0b6f8f4c-5a5e-4c55-8a39-31b2f1b9b0a7
                  timestamp: '2026-11-20T11:00:00Z'
    ServiceUnavailable:
      description: Destination down or circuit open. Always distinct from 4xx business errors.
      headers:
        X-Request-Id:
          description: Echo of the request header
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Correlation-Id:
          description: Echo of this logical operation's correlation ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Trace-Id:
          description: Echo of the business-flow trace ID
          schema:
