      properties:
        bookingId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        customerId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        providerId:
          type: string
          description: Review target. Reviews are per provider, not per room.
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        providerName:
          type: string
          description: Accommodation provider company name
        branchId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        branchName:
          type: string
          description: Booked branch property name
        stayStartDate:
          type: string
          format: date
        stayEndDate:
          type: string
          format: date
        reviewableFrom:
          type: string
          format: date
        bookingStatus:
          $ref: '#/components/schemas/BookingStatus'
        eligible:
