          items:
            $ref: '#/components/schemas/Amenity'
      - name: matchMode
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MatchMode'
      - $ref: '#/components/parameters/CheckInDate'
      - $ref: '#/components/parameters/CheckOutDate'
      - name: rooms
        in: query
        required: false
        description: Rooms needed. Branches with fewer available rooms are excluded.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: sort
