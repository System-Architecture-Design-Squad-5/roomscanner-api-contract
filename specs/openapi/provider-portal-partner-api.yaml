components:
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: UUID per HTTP call; echoed by the server.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    XCorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      description: UUID for one logical operation; reused only for its transport retries and response.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    XTraceId:
      name: X-Trace-Id
      in: header
      required: true
      description: Business-flow UUID shared by related operations; maps to Kafka traceId.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID scoped to the authenticated partner and operation. Same key/body replays the original outcome; changed
        body returns 409. Durable booking/payment uniqueness survives Redis cache expiry.
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from pageInfo.nextCursor.
      schema:
        type: string
    CheckInDate:
      name: checkInDate
      in: query
      required: false
      description: 'Must be sent with checkOutDate. Default: tonight (Decision D-05).'
      schema:
        type: string
        format: date
    CheckOutDate:
      name: checkOutDate
      in: query
      required: false
      description: After checkInDate, at most 30 nights.
      schema:
        type: string
        format: date
    MembershipTierQuery:
      name: membershipTier
      in: query
      required: false
      description: When PREMIUM, premiumPricePerNight is filled where a policy is assigned.
      schema:
        $ref: '#/components/schemas/MembershipTier'
  responses:
    BadRequest:
      description: Malformed or missing fields.
      headers:
        X-Request-Id:
          description: Echo of the request header
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Correlation-Id:
          description: Echo of this logical operation's correlation ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Trace-Id:
          description: Echo of the business-flow trace ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: checkOutDate must be after checkInDate.
                  details:
                  - field: checkOutDate
                    issue: must be after checkInDate
                  requestId: 0b6f8f4c-5a5e-4c55-8a39-31b2f1b9b0a7
                  timestamp: '2026-11-20T11:00:00Z'
    Unauthorized:
      description: Missing, expired or invalid partner token or signature.
      headers:
        X-Request-Id:
          description: Echo of the request header
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Correlation-Id:
          description: Echo of this logical operation's correlation ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Trace-Id:
          description: Echo of the business-flow trace ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthenticated:
              value:
                error:
                  code: PARTNER_UNAUTHENTICATED
                  message: The partner access token is missing or expired.
                  requestId: 0b6f8f4c-5a5e-4c55-8a39-31b2f1b9b0a7
                  timestamp: '2026-11-20T11:00:00Z'
    Forbidden:
      description: Token lacks the required scope, or the resource is outside the agreed data scope.
      headers:
        X-Request-Id:
          description: Echo of the request header
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Correlation-Id:
          description: Echo of this logical operation's correlation ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        X-Trace-Id:
          description: Echo of the business-flow trace ID
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                error:
