      x-required-scopes:
      - booking:read
  /event-suggestions:
    post:
      tags:
      - Regional events
      operationId: requestEventSuggestions
      summary: PP-OP-12 Request event suggestions
      description: |-
        Returns the two most highly rated providers in the city of a favorited event (Decision D-12). Simplex binding. At Medium the same bodies travel over STOMP/WebSocket (see PP-06 markdown); at Ultimo PP-OP-13 replaces this.

        **SRS traceability:** PP-EVENT-S01, S02, M01; CP-EVENT-M02, M03
      x-contract-id: PP-OP-12
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSuggestionRequest'
            examples:
              default:
                value:
                  requestId: 2e9b0c11-0000-4000-8000-000000000a01
                  favoriteId: fa7e0000-0000-4000-8000-000000000b01
                  customerId: 7d1e2f30-0000-4000-8000-000000000901
                  event:
                    eventId: e7e70000-0000-4000-8000-000000000c01
                    name: Hùng Kings' Temple Festival
                    summary: National festival honouring the Hùng Kings with processions, folk games and xoan singing.
                    locationName: Hùng Kings' Temple, Viet Tri City, Phu Tho
                    city: Viet Tri
                    country: VN
                    timeZone: Asia/Ho_Chi_Minh
                    startDate: '2027-04-12'
                    endDate: '2027-04-18'
                    searchRoute: /search?city=Viet%20Tri&country=VN&checkIn=2027-04-12&checkOut=2027-04-13
      responses:
        '200':
          description: Suggestions.
          headers:
            X-Request-Id:
              description: Echo of the request header
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Correlation-Id:
              description: Echo of this logical operation's correlation ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Trace-Id:
              description: Echo of the business-flow trace ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-RateLimit-Limit:
              description: Requests allowed in the window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in the window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSuggestionResponse'
              examples:
                default:
                  value:
                    requestId: 2e9b0c11-0000-4000-8000-000000000a01
                    favoriteId: fa7e0000-0000-4000-8000-000000000b01
                    customerId: 7d1e2f30-0000-4000-8000-000000000901
                    event:
                      eventId: e7e70000-0000-4000-8000-000000000c01
                      name: Hùng Kings' Temple Festival
                      summary: National festival honouring the Hùng Kings with processions, folk games and xoan singing.
                      locationName: Hùng Kings' Temple, Viet Tri City, Phu Tho
                      city: Viet Tri
                      country: VN
                      timeZone: Asia/Ho_Chi_Minh
                      startDate: '2027-04-12'
                      endDate: '2027-04-18'
                      searchRoute: /search?city=Viet%20Tri&country=VN&checkIn=2027-04-12&checkOut=2027-04-13
                    suggestions:
                    - rank: 1
                      providerId: 5b1c2d3e-0000-4000-8000-000000000170
                      providerName: Phu Tho Tourism JSC
                      branchId: 9a8b7c6d-0000-4000-8000-000000000270
