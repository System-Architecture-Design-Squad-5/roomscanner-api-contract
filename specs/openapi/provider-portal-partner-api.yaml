                  message: Scope booking:write is required.
                  requestId: 0b6f8f4c-5a5e-4c55-8a39-31b2f1b9b0a7
                  timestamp: '2026-11-20T11:00:00Z'
    NotFound:
      description: Unknown or archived resource.
      headers:
