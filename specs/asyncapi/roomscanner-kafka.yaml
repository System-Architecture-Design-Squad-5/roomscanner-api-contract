operations:
  serveSearchRequests:
    action: receive
    channel:
      $ref: '#/channels/searchRequest'
    title: Serve search requests
    description: PP consumes search requests and replies on rs.search.response.v1 with the same correlationId (PP-SEARCH-U02,
      PP-ROOM-U02).
    messages:
    - $ref: '#/channels/searchRequest/messages/searchRequest'
    reply:
      channel:
        $ref: '#/channels/searchResponse'
      messages:
      - $ref: '#/channels/searchResponse/messages/searchResponse'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
          - pp-search-service
          description: Consumer group
        bindingVersion: 0.5.0
  serveBookingRequests:
    action: receive
    channel:
      $ref: '#/channels/bookingRequest'
    title: Serve booking requests
    description: PP consumes quote/booking/cancellation requests. Both booking-service instances join the same consumer group,
      so Kafka fails over to the redundant instance (PP-BOOK-U01).
    messages:
    - $ref: '#/channels/bookingRequest/messages/bookingRequest'
    reply:
      channel:
        $ref: '#/channels/bookingResponse'
      messages:
      - $ref: '#/channels/bookingResponse/messages/bookingResponse'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
          - pp-booking-service
          description: Consumer group
        bindingVersion: 0.5.0
  publishBookingEvents:
    action: send
    channel:
      $ref: '#/channels/bookingEvents'
    title: Publish booking status events
    description: PP publishes every booking transition through a transactional outbox (PP-OP-11).
    messages:
    - $ref: '#/channels/bookingEvents/messages/bookingStatusEvent'
  requestRatingStatistics:
    action: send
    channel:
      $ref: '#/channels/ratingStatsRequest'
    title: Request rating statistics
    description: PP requests provider statistics on demand and resends on timeout (PP-RATING-U01, U02, INT-U03). Served by
      CP's Modular Monolith RatingModule; a second monolith instance joins group cp-rating-service for redundancy (CP-RATING-U01).
    messages:
    - $ref: '#/channels/ratingStatsRequest/messages/ratingStatisticsRequest'
    reply:
      channel:
        $ref: '#/channels/ratingStatsResponse'
      messages:
      - $ref: '#/channels/ratingStatsResponse/messages/ratingStatisticsResponse'
  requestMembership:
    action: send
    channel:
      $ref: '#/channels/membershipRequest'
    title: Request membership
    description: PP verifies Premium membership before applying a discount (Decision D-06). Served by CP's Modular Monolith
      EventModule (group cp-membership-service).
    messages:
    - $ref: '#/channels/membershipRequest/messages/membershipRequest'
    reply:
      channel:
        $ref: '#/channels/membershipResponse'
      messages:
      - $ref: '#/channels/membershipResponse/messages/membershipResponse'
  receiveEventFavorites:
    action: receive
    channel:
      $ref: '#/channels/eventFavorite'
    title: Receive event favorite changes
    description: PP schedules or publishes regional event notifications (Decision D-12).
    messages:
    - $ref: '#/channels/eventFavorite/messages/eventFavoriteChanged'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
          - pp-event-service
          description: Consumer group
        bindingVersion: 0.5.0
  publishEventNotifications:
    action: send
    channel:
      $ref: '#/channels/eventNotification'
    title: Publish regional event notifications
    description: PP publishes to the CP-created topic; CP's dedicated consumer (group cp-event-notification-consumer) displays
      it to eligible Premium customers (PP-EVENT-U01, U02; CP-EVENT-U02).
    messages:
    - $ref: '#/channels/eventNotification/messages/regionalEventNotification'
