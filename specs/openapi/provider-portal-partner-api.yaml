openapi: 3.0.3
info:
  title: RoomScanner Provider Portal - Partner API
  version: 1.0.0
  description: |-
    REST API that the **Provider Portal (PP)** (*Microservices architecture*, `BE-U01` to `BE-U09`) provides to the **Customer Portal (CP)** (*Modular Monolith architecture*, `BE-M01` to `BE-M08`).
    This file is the machine-readable form of `provider-portal/PP-01` to `PP-06` in the squad API contract; the markdown
    documents remain the source for business rules (`common/03-agreed-decisions.md`).

    * Simplex: REST, a standalone mock of the partner is allowed (INT-S01, INT-S02).
    * Medium: REST against the real partner with partner authentication (INT-M01 to INT-M03).
    * Ultimo: the same payloads are exchanged over Kafka (see `specs/asyncapi/roomscanner-kafka.yaml`).

    PP pushes booking status changes to CP through CP's webhook (`POST /booking-events` in the Customer Portal specification) at Simplex and Medium,
    and through the `rs.booking.events.v1` topic at Ultimo.
  contact:
    name: RoomScanner squad API contract
    url: https://github.com/SQUAD-ORGANIZATION/roomscanner-api-contract
servers:
- url: http://localhost:8080/api/v1/partner
  description: Local / Simplex
- url: https://pp-gateway.{squad}.roomscanner.local/api/v1/partner
  description: Deployed (PP Microservices via PP API Gateway + Service Discovery on Machine 4)
  variables:
    squad:
      default: squad
      description: Squad identifier
tags:
- name: Partner authentication
  description: Client-credentials token for partner calls (INT-M03)
- name: Search and catalogue
  description: 'PP-01: authoritative search and room catalogue'
- name: Pricing and discounts
  description: 'PP-02: Premium discount pricing and inventory hold'
- name: Bookings
  description: 'PP-03: reservations (primary resource)'
- name: Regional events
  description: 'PP-06: event suggestions'
paths:
  /auth/token:
    post:
      tags:
      - Partner authentication
      operationId: issuePartnerToken
      summary: Issue a partner access token
      description: 'Custom JSON credential exchange for a short-lived signed JWT; this is not an OAuth2 token endpoint. Secrets
        are shared out-of-band and never committed. Rate limit: 10 requests per 60 s.'
      x-contract-id: AUTH-01
      security: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XTraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              default:
                value:
                  clientId: cp-subsystem
                  clientSecret: replace-with-secret-from-environment-0123456789
                  scope:
                  - search:read
                  - booking:write
      responses:
        '200':
          description: Token issued.
          headers:
            X-Request-Id:
              description: Echo of the request header
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Correlation-Id:
              description: Echo of this logical operation's correlation ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-Trace-Id:
              description: Echo of the business-flow trace ID
              schema:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            X-RateLimit-Limit:
              description: Requests allowed in the window
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in the window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                default:
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InBwLTIwMjYtMTEifQ.eyJzdWIiOiJjcC1zdWJzeXN0ZW0ifQ.c2lnbmF0dXJl
                    tokenType: Bearer
                    expiresIn: 900
                    scope:
                    - search:read
                    - booking:write
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /search/providers:
    get:
      tags:
      - Search and catalogue
      operationId: searchProviders
      summary: PP-OP-01 Search providers
      description: |-
        Returns the branches in a city that match the keyword and filters, with cursor pagination for lazy loading. OR semantics with results ranked by number of matched terms (Decision D-03).

        **SRS traceability:** PP-SEARCH-S01, S02, M01, M02, U01, U02; CP-SEARCH-S01, S02, M01, M02

        **Ultimo Kafka binding:** rs.search.request.v1 (type=SEARCH_PROVIDERS) -> rs.search.response.v1 (type=SEARCH_PROVIDERS_RESULT)
      x-contract-id: PP-OP-01
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/XCorrelationId'
      - $ref: '#/components/parameters/XTraceId'
      - name: city
        in: query
        required: true
        description: Case-insensitive exact city match inside the squad's sub-region.
        schema:
          type: string
          maxLength: 100
        example: Hoi An
      - name: country
        in: query
        required: false
        description: Narrows the request to one shard (PP-SEARCH-U01).
        schema:
          type: string
          description: ISO 3166-1 alpha-2 country code
          pattern: ^[A-Z]{2}$
      - name: q
        in: query
        required: false
        description: 'Simplex: case-insensitive substring on provider and branch name. Medium: multi-field full-text search
          (Decision D-03).'
        schema:
          type: string
          maxLength: 200
      - name: category
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ProviderCategory'
      - name: roomType
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RoomType'
      - name: amenities
        in: query
        required: false
